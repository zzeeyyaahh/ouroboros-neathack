[project]
name = "ouroboros"
version = "0.1.0"
description = "Self-watching agent pipeline: a dossier worker that traces every run in neatlogs, and a supervisor that reads its own traces to heal failures."
requires-python = ">=3.11"
dependencies = [
    "neatlogs",
    "openai",
    "httpx",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ouro*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
